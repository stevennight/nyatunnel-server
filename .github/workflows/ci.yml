name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      - name: Check VERSION and web/app/package.json agree
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          web_version="$(node -p "require('./web/app/package.json').version")"
          if [ "${web_version}" != "${version}" ]; then
            echo "web/app/package.json version ${web_version} does not match VERSION ${version}" >&2
            exit 1
          fi

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet Go
        run: go vet ./...

      - name: Test Go
        run: go test -race ./...

      - name: Install web dependencies
        working-directory: web/app
        run: npm ci

      - name: Test web
        working-directory: web/app
        run: npm test

      - name: Build web
        working-directory: web/app
        run: npm run build

  docker:
    name: Docker image (smoke test)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build (amd64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: nyatunnel-server:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm --entrypoint /usr/local/bin/nyatunnel-server nyatunnel-server:smoke --version
          docker run -d --name smoke nyatunnel-server:smoke
          for i in $(seq 1 20); do
            if docker exec smoke /usr/local/bin/nyatunnel-server --healthcheck; then
              docker rm -f smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1
