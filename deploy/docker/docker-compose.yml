name: nyatunnel

# Runs next to an existing Caddy on the same host (see deploy/caddy/Caddyfile and docs/设计方案.md §12).
# Host networking: NyaTunnel listens on 127.0.0.1:8080/8081/8082 for Caddy, and opens the TCP/UDP
# tunnel ports from the port pools directly on the host.
services:
  server:
    container_name: nyatunnel-server
    image: "${NYATUNNEL_IMAGE:?set in deploy/docker/.env}:${NYATUNNEL_VERSION:?set in deploy/docker/.env}"
    restart: unless-stopped
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    environment:
      NYATUNNEL_PUBLIC_URL: ${NYATUNNEL_PUBLIC_URL:?set in deploy/docker/.env}
      NYATUNNEL_LISTEN: ${NYATUNNEL_LISTEN:-127.0.0.1:8080}
      NYATUNNEL_INGRESS_LISTEN: ${NYATUNNEL_INGRESS_LISTEN:-127.0.0.1:8081}
      NYATUNNEL_INTERNAL_LISTEN: ${NYATUNNEL_INTERNAL_LISTEN:-127.0.0.1:8082}
      NYATUNNEL_PORT_BIND: ${NYATUNNEL_PORT_BIND:-0.0.0.0}
      NYATUNNEL_PUBLIC_IPS: ${NYATUNNEL_PUBLIC_IPS:-}
      NYATUNNEL_TRUSTED_PROXY_CIDRS: ${NYATUNNEL_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      NYATUNNEL_DIRECT_LISTEN: ${NYATUNNEL_DIRECT_LISTEN:-}
      NYATUNNEL_DIRECT_ADDR: ${NYATUNNEL_DIRECT_ADDR:-}
      NYATUNNEL_DATA: /data
      # Keep the secrets key outside the data directory (and back it up): without it TOTP secrets cannot be opened.
      NYATUNNEL_SECRETS_KEY_FILE: /secrets/secrets.key
    volumes:
      - ../../data:/data
      - ../../secrets:/secrets
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
